# Configuração do Supabase CLI local — Flvxus v2
# Portas padrão do CLI. Ajuste apenas se houver conflito local.
# Aplicação real (supabase start / db reset) exige Docker — ver docs/pendencias.md.

project_id = "nltoaiiquuryjlnikyxy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# E-mails de teste capturados pelo Inbucket em dev (nenhum e-mail real é enviado).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Limite por arquivo; vídeos de exercício podem ser grandes.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmação de e-mail desligada em dev para facilitar o harness de RLS;
# em produção isto é gerenciado pelo projeto hospedado, não por este arquivo.
enable_confirmations = false

[analytics]
enabled = false
port = 54327

# Edge Functions de IA (Fase 6 — ADR 0001 / architecture §8).
# verify_jwt = true: o gateway exige um JWT válido antes de invocar a função;
# a função ainda revalida JWT + papel trainer no auth-guard (defesa em camadas).
# Segredos (ANTHROPIC_API_KEY, ANTHROPIC_MODEL) vêm de `supabase secrets set`,
# nunca deste arquivo nem de NEXT_PUBLIC_* — ver docs/ia.md.
[functions.generate-diet]
verify_jwt = true

[functions.suggest-workout]
verify_jwt = true

[functions.analyze-assessment]
verify_jwt = true
